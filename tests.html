<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Plan data smoke tests</title>
</head>
<body>
  <h1>Plan data smoke tests</h1>
  <ul id="results"></ul>
  <script type="module">
    import {
      DAY_ORDER, DAYS, BLOCK_STRUCTURE, MEAL_PLAN, INCREMENT_BY_TYPE,
    } from './js/data/plan.js';
    import {
      getSetting, putSetting,
      getSessionLog, putSessionLog, getAllSessionLogs,
      getExerciseHistory, appendExercisePerformance, upsertExercisePerformance,
      getBodyMetric, getAllBodyMetrics, putBodyMetric,
      getDietLog, putDietLog,
      getAllCustomFoods, addCustomFood,
      getCheckin, putCheckin,
      exportAllData, importAllData,
    } from './js/db.js';

    const results = document.getElementById('results');
    const checks = [];
    const check = async (name, fn) => {
      let ok = false;
      let detail = '';
      try {
        const r = await fn();
        ok = r === true;
        if (!ok) detail = typeof r === 'string' ? r : 'assertion false';
      } catch (err) {
        detail = err.message;
      }
      checks.push({ name, ok, detail });
    };

    await check('DAY_ORDER has 7 entries', () => DAY_ORDER.length === 7 || `length ${DAY_ORDER.length}`);

    await check('every DAY_ORDER key exists in DAYS', () => {
      const missing = DAY_ORDER.filter((d) => !(d in DAYS));
      return missing.length === 0 || `missing: ${missing.join(', ')}`;
    });

    await check('every non-rest day has at least 7 exercises', () => {
      const short = DAY_ORDER.filter((d) => !DAYS[d].isRestDay && DAYS[d].exercises.length < 7)
        .map((d) => `${d}=${DAYS[d].exercises.length}`);
      return short.length === 0 || `short: ${short.join(', ')}`;
    });

    await check('every PlanExercise id is unique across all days', () => {
      const ids = DAY_ORDER.flatMap((d) => DAYS[d].exercises.map((e) => e.id));
      const dupes = ids.filter((id, i) => ids.indexOf(id) !== i);
      return dupes.length === 0 || `duplicates: ${[...new Set(dupes)].join(', ')}`;
    });

    await check('BLOCK_STRUCTURE covers weeks 1-12 exactly once', () => {
      const weeks = BLOCK_STRUCTURE.flatMap((b) => b.weeks).sort((a, b) => a - b);
      const expected = Array.from({ length: 12 }, (_, i) => i + 1);
      return JSON.stringify(weeks) === JSON.stringify(expected) || `weeks: ${weeks.join(',')}`;
    });

    await check('MEAL_PLAN has all 7 day keys with a meals array', () => {
      const bad = DAY_ORDER.filter((d) => !MEAL_PLAN[d] || !Array.isArray(MEAL_PLAN[d].meals));
      return bad.length === 0 || `bad: ${bad.join(', ')}`;
    });

    await check('MEAL_PLAN meal kcal sums match dayTotalKcal within 5', () => {
      const off = DAY_ORDER.map((d) => {
        const sum = MEAL_PLAN[d].meals.reduce((s, m) => s + m.kcal, 0);
        return { d, diff: sum - MEAL_PLAN[d].dayTotalKcal };
      }).filter((x) => Math.abs(x.diff) > 5);
      return off.length === 0 || off.map((x) => `${x.d}:${x.diff}`).join(', ');
    });

    // --- js/db.js (Task 2) -------------------------------------------------
    // Baseline reads (rather than hardcoded 0/1/2) keep these assertions
    // correct even if tests.html is re-run against an IndexedDB database
    // that already has data from a previous run (see brief Step 3 note on
    // stale databases). On a fresh DB these behave exactly like the literal
    // 1/2 lengths the task brief describes.

    await check('putSetting/getSetting round-trips a value', async () => {
      await putSetting({ id: 'app', weightKg: 67 });
      const setting = await getSetting();
      return (setting !== null && setting.id === 'app' && setting.weightKg === 67)
        || `got ${JSON.stringify(setting)}`;
    });

    const exerciseId = 'incline-db-press';
    const baselineHistory = await getExerciseHistory(exerciseId);
    const baselineLen = baselineHistory.length;
    const entry1 = { date: '2026-01-01', weekNumber: 1, sets: [{ weight: 20, reps: 8, rir: 2, isWarmup: false }] };

    await check('appendExercisePerformance + getExerciseHistory returns the appended entry', async () => {
      await appendExercisePerformance(exerciseId, entry1);
      const history = await getExerciseHistory(exerciseId);
      const last = history[history.length - 1];
      return (history.length === baselineLen + 1 && JSON.stringify(last) === JSON.stringify(entry1))
        || `length ${history.length}, last=${JSON.stringify(last)}`;
    });

    await check('a second appendExercisePerformance call appends, not overwrites', async () => {
      const entry2 = { date: '2026-01-08', weekNumber: 2, sets: [{ weight: 22, reps: 8, rir: 1, isWarmup: false }] };
      await appendExercisePerformance(exerciseId, entry2);
      const history = await getExerciseHistory(exerciseId);
      const first = history[baselineLen];
      return (history.length === baselineLen + 2 && JSON.stringify(first) === JSON.stringify(entry1))
        || `length ${history.length}, first-new-entry=${JSON.stringify(first)}`;
    });

    await check('exportAllData then importAllData reproduces identical getAllBodyMetrics output', async () => {
      await putBodyMetric({ date: '2026-02-02', weightKg: 70.2, waistCm: 81, note: 'db-test' });
      const before = await getAllBodyMetrics();
      const dump = await exportAllData();
      await importAllData(dump);
      const after = await getAllBodyMetrics();
      return JSON.stringify(before) === JSON.stringify(after)
        || `before=${JSON.stringify(before)} after=${JSON.stringify(after)}`;
    });

    // Review Focus (Task 17): full round-trip across all 7 stores, not just
    // bodyMetrics. Writes one real record into every store via db.js's own
    // put functions, exports, re-imports into the same DB, then re-fetches
    // each store and diffs against the literal record written (not just a
    // before/after snapshot) — this is the regression guard that would catch
    // exportAllData or importAllData silently dropping a store.
    await check('Review Focus: exportAllData + importAllData round-trips all 7 stores', async () => {
      const roundTripSessionLog = { id: 'rt_2026-03-03_mon', dayKey: 'mon', date: '2026-03-03', exercises: [] };
      const roundTripExerciseId = 'round-trip-exercise';
      const roundTripExerciseEntry = {
        date: '2026-03-03', weekNumber: 9, sets: [{ weight: 30, reps: 10, rir: 2, isWarmup: false }],
      };
      const roundTripBodyMetric = { date: '2026-03-03', weightKg: 71.1, waistCm: 80.5, note: 'round-trip' };
      const roundTripDietLog = {
        date: '2026-03-03', checkedMealIds: ['m1'], addOn: null, hadBanana: false, customFoodIds: [],
      };
      const roundTripCustomFood = { name: 'round-trip food', kcal: 123, protein: 10 };
      const roundTripCheckin = { weekNumber: 97, avgWeight: 71, avgWaist: 80, decision: 'test' };
      const roundTripSettingsMarker = `rt-marker-${Date.now()}`;

      const existingSettings = await getSetting();
      await putSetting({ ...(existingSettings || {}), roundTripMarker: roundTripSettingsMarker });
      await putSessionLog(roundTripSessionLog);
      await appendExercisePerformance(roundTripExerciseId, roundTripExerciseEntry);
      await putBodyMetric(roundTripBodyMetric);
      await putDietLog(roundTripDietLog);
      const customFoodId = await addCustomFood(roundTripCustomFood);
      await putCheckin(roundTripCheckin);

      const dump = await exportAllData();
      await importAllData(dump);

      const afterSettings = await getSetting();
      const afterSessionLog = await getSessionLog(roundTripSessionLog.id);
      const afterExerciseHistory = await getExerciseHistory(roundTripExerciseId);
      const afterBodyMetric = await getBodyMetric(roundTripBodyMetric.date);
      const afterDietLog = await getDietLog(roundTripDietLog.date);
      const afterCustomFoods = await getAllCustomFoods();
      const afterCheckin = await getCheckin(roundTripCheckin.weekNumber);

      const problems = [];
      if (afterSettings?.roundTripMarker !== roundTripSettingsMarker) {
        problems.push(`settings: ${JSON.stringify(afterSettings)}`);
      }
      if (JSON.stringify(afterSessionLog) !== JSON.stringify(roundTripSessionLog)) {
        problems.push(`sessionLogs: ${JSON.stringify(afterSessionLog)}`);
      }
      const lastHistoryEntry = afterExerciseHistory[afterExerciseHistory.length - 1];
      if (JSON.stringify(lastHistoryEntry) !== JSON.stringify(roundTripExerciseEntry)) {
        problems.push(`exerciseHistory: ${JSON.stringify(afterExerciseHistory)}`);
      }
      if (JSON.stringify(afterBodyMetric) !== JSON.stringify(roundTripBodyMetric)) {
        problems.push(`bodyMetrics: ${JSON.stringify(afterBodyMetric)}`);
      }
      if (JSON.stringify(afterDietLog) !== JSON.stringify(roundTripDietLog)) {
        problems.push(`dietLog: ${JSON.stringify(afterDietLog)}`);
      }
      const matchedCustomFood = afterCustomFoods.find((f) => f.id === customFoodId);
      if (
        !matchedCustomFood
        || matchedCustomFood.name !== roundTripCustomFood.name
        || matchedCustomFood.kcal !== roundTripCustomFood.kcal
        || matchedCustomFood.protein !== roundTripCustomFood.protein
      ) {
        problems.push(`customFoods: ${JSON.stringify(afterCustomFoods)}`);
      }
      if (JSON.stringify(afterCheckin) !== JSON.stringify(roundTripCheckin)) {
        problems.push(`checkins: ${JSON.stringify(afterCheckin)}`);
      }

      return problems.length === 0 || problems.join(' | ');
    });

    // --- js/db.js (final-review fix: import validation) -------------------
    // importAllData must validate the backup's shape BEFORE clearing any
    // store, so a wrong-shaped-but-valid JSON file (e.g. `{}`) can never
    // silently wipe real data, and a store.put() throw (e.g. a record
    // missing its keyPath field) must abort the whole transaction rather
    // than commit a partial clear-without-full-restore.

    await check('importAllData rejects {} without touching existing data', async () => {
      const before = await getSetting();
      let threw = false;
      try {
        await importAllData({});
      } catch (err) {
        threw = true;
      }
      const after = await getSetting();
      return (threw && JSON.stringify(after) === JSON.stringify(before))
        || `threw=${threw}, before=${JSON.stringify(before)}, after=${JSON.stringify(after)}`;
    });

    await check('importAllData rejects a non-object (e.g. an array) without touching existing data', async () => {
      const before = await getSetting();
      let threw = false;
      try {
        await importAllData([1, 2, 3]);
      } catch (err) {
        threw = true;
      }
      const after = await getSetting();
      return (threw && JSON.stringify(after) === JSON.stringify(before))
        || `threw=${threw}, before=${JSON.stringify(before)}, after=${JSON.stringify(after)}`;
    });

    await check('importAllData rejects a record missing its keyPath field, aborting the WHOLE import (no partial clear)', async () => {
      const beforeSettings = await getSetting();
      const beforeSessionLogs = await getAllSessionLogs();
      const validDump = await exportAllData();
      // sessionLogs' keyPath is 'id' — a record with no `id` field makes
      // store.put() throw synchronously inside importAllData's transaction.
      const malformedDump = { ...validDump, sessionLogs: [...validDump.sessionLogs, { dayKey: 'mon', noId: true }] };

      let threw = false;
      try {
        await importAllData(malformedDump);
      } catch (err) {
        threw = true;
      }

      const afterSettings = await getSetting();
      const afterSessionLogs = await getAllSessionLogs();
      return (
        threw
        && JSON.stringify(afterSettings) === JSON.stringify(beforeSettings)
        && JSON.stringify(afterSessionLogs) === JSON.stringify(beforeSessionLogs)
      ) || `threw=${threw}, settings before/after differ or sessionLogs before/after differ`;
    });

    // A backup taken before any setting was ever saved has settings: null
    // (getSetting() returns null, not undefined, for an absent record) —
    // validateBackupShape must treat that the same as an absent field,
    // not reject the whole file over it.
    await check('importAllData accepts a backup with settings: null (never-saved-settings case)', async () => {
      const validDump = await exportAllData();
      const dumpWithNullSettings = { ...validDump, settings: null };
      let threw = false;
      try {
        await importAllData(dumpWithNullSettings);
      } catch (err) {
        threw = true;
      }
      return !threw || `unexpectedly threw on settings: null`;
    });

    // --- js/db.js (final-review fix: exportAllData loops STORE_NAMES) -----
    await check('exportAllData returns exactly the 7 store keys plus exportedAt (no store silently dropped)', async () => {
      const dump = await exportAllData();
      const expectedKeys = [
        'settings', 'sessionLogs', 'exerciseHistory', 'bodyMetrics', 'dietLog', 'customFoods', 'checkins', 'exportedAt',
      ];
      const actualKeys = Object.keys(dump).sort();
      return eqKeys(actualKeys, expectedKeys.slice().sort()) || `got keys: ${actualKeys.join(', ')}`;
    });
    function eqKeys(a, b) {
      return JSON.stringify(a) === JSON.stringify(b);
    }

    // --- js/week.js (Task 3) ----------------------------------------------
    // Loaded dynamically so a missing or broken module fails only these
    // checks instead of blanking the whole page (keeps Task 1-2 results visible).
    const week = await import('./js/week.js').catch((err) => ({ loadError: err.message }));
    const eq = (actual, expected) => (JSON.stringify(actual) === JSON.stringify(expected)
      || `got ${JSON.stringify(actual)}, expected ${JSON.stringify(expected)}`);
    const START = '2026-01-05'; // Monday (verified: new Date('2026-01-05T00:00:00').getDay() === 1)

    await check('getWeekNumber: start date is week 1', () => eq(week.getWeekNumber(START, '2026-01-05'), 1));
    await check('getWeekNumber: last day of week 1 is week 1', () => eq(week.getWeekNumber(START, '2026-01-11'), 1));
    await check('getWeekNumber: day 7 starts week 2', () => eq(week.getWeekNumber(START, '2026-01-12'), 2));
    await check('getWeekNumber: day before start is null', () => eq(week.getWeekNumber(START, '2026-01-04'), null));
    await check('getWeekNumber: last day of week 12 (day 83) is week 12', () => eq(week.getWeekNumber(START, '2026-03-29'), 12));
    await check('getWeekNumber: first day after week 12 (day 84) is null', () => eq(week.getWeekNumber(START, '2026-03-30'), null));
    await check('getWeekNumber: well past week 12 (2027-06-01) is null, not clamped to 12', () => eq(week.getWeekNumber(START, '2027-06-01'), null));

    await check('getPhaseForWeek(1).phase is intro', () => eq(week.getPhaseForWeek(1).phase, 'intro'));
    await check('getPhaseForWeek(2).phase is build1', () => eq(week.getPhaseForWeek(2).phase, 'build1'));
    await check('getPhaseForWeek(6).phase is deload, setMultiplier is 0.5', () => eq(
      [week.getPhaseForWeek(6).phase, week.getPhaseForWeek(6).setMultiplier], ['deload', 0.5],
    ));
    await check('getPhaseForWeek(7).phase is build2', () => eq(week.getPhaseForWeek(7).phase, 'build2'));
    await check('getPhaseForWeek(12).phase is deload2', () => eq(week.getPhaseForWeek(12).phase, 'deload2'));
    await check('getPhaseForWeek(13) is null', () => eq(week.getPhaseForWeek(13), null));
    await check('getPhaseForWeek(0) is null', () => eq(week.getPhaseForWeek(0), null));

    await check('getDayKeyForDate: 2026-01-05 (Monday) is mon', () => eq(week.getDayKeyForDate('2026-01-05'), 'mon'));
    await check('getDayKeyForDate: 2026-01-11 (Sunday) is sun', () => eq(week.getDayKeyForDate('2026-01-11'), 'sun'));

    await check('isCheckinWeek true for 4, 8, 12', () => eq([4, 8, 12].map((w) => week.isCheckinWeek(w)), [true, true, true]));
    await check('isCheckinWeek false for 1 and 5', () => eq([1, 5].map((w) => week.isCheckinWeek(w)), [false, false]));

    await check('getWeekInfo: start date composes week 1 / mon / intro', () => {
      const info = week.getWeekInfo(START, START);
      return eq([info.weekNumber, info.dayKey, info.phaseInfo.phase, info.isCheckinWeek, info.isPlanComplete],
        [1, 'mon', 'intro', false, false]);
    });
    await check('getWeekInfo: week 12 is a check-in week, not plan complete', () => {
      const info = week.getWeekInfo(START, '2026-03-29');
      return eq([info.weekNumber, info.phaseInfo.phase, info.isCheckinWeek, info.isPlanComplete],
        [12, 'deload2', true, false]);
    });
    await check('getWeekInfo: day 84 (week 13 boundary) is plan complete', () => {
      const info = week.getWeekInfo(START, '2026-03-30');
      return eq([info.weekNumber, info.phaseInfo, info.isPlanComplete], [null, null, true]);
    });
    await check('getWeekInfo: well past week 12 (2027-06-01) is plan complete', () => {
      const info = week.getWeekInfo(START, '2027-06-01');
      return eq([info.weekNumber, info.phaseInfo, info.isCheckinWeek, info.isPlanComplete], [null, null, false, true]);
    });
    await check('getWeekInfo: before start is not plan complete', () => {
      const info = week.getWeekInfo(START, '2026-01-04');
      return eq([info.weekNumber, info.isPlanComplete], [null, false]);
    });

    // --- js/progression.js (Task 4) ----------------------------------------
    // Loaded dynamically (see Task 3 note above) so a missing/broken module
    // (expected during the RED phase, before progression.js exists) fails
    // only these checks instead of blanking the whole page.
    const progression = await import('./js/progression.js').catch((err) => ({ loadError: err.message }));

    const perf = (sets) => ({ date: '2026-02-01', weekNumber: 3, sets });
    const workingSet = (reps, rir) => ({ weight: 50, reps, rir, isWarmup: false });
    const warmupSet = (reps, rir) => ({ weight: 20, reps, rir, isWarmup: true });

    await check('getLastPerformance: empty history returns null', () => eq(progression.getLastPerformance([]), null));

    await check('getLastPerformance: returns the last (chronologically latest) entry', () => {
      const h = [perf([workingSet(8, 2)]), perf([workingSet(9, 2)])];
      return eq(progression.getLastPerformance(h), h[1]);
    });

    const dbExercise = { repsLow: 8, repsHigh: 12, rir: '2', incrementType: 'dumbbell' };

    await check('recommendNextSession: no history returns noHistory', () => eq(
      progression.recommendNextSession(dbExercise, []),
      { type: 'noHistory' },
    ));

    await check('recommendNextSession: all working sets at repsHigh and at/under target RIR -> increaseWeight', () => {
      const history = [perf([workingSet(12, 2), workingSet(12, 2), workingSet(12, 2)])];
      return eq(
        progression.recommendNextSession(dbExercise, history),
        { type: 'increaseWeight', amount: INCREMENT_BY_TYPE[dbExercise.incrementType] },
      );
    });

    await check('recommendNextSession: warm-up sets are ignored (clean working sets, dirty warm-up) -> increaseWeight', () => {
      const history = [perf([warmupSet(1, 5), workingSet(12, 2), workingSet(12, 2), workingSet(12, 2)])];
      return eq(
        progression.recommendNextSession(dbExercise, history),
        { type: 'increaseWeight', amount: INCREMENT_BY_TYPE[dbExercise.incrementType] },
      );
    });

    // Review Focus: one working set short on RIR (even though its reps hit target) must block increaseWeight.
    await check('recommendNextSession: one working set short on RIR (rest clean at repsHigh) -> beatLastTime, not increaseWeight', () => {
      const history = [perf([workingSet(12, 2), workingSet(12, 2), workingSet(12, 3)])];
      return eq(
        progression.recommendNextSession(dbExercise, history),
        { type: 'beatLastTime', targetReps: 12 },
      );
    });

    // Review Focus: one working set short on reps (even though its RIR hit target) must block increaseWeight.
    await check('recommendNextSession: one working set short on reps (rest clean at repsHigh) -> beatLastTime, not increaseWeight', () => {
      const history = [perf([workingSet(12, 2), workingSet(12, 2), workingSet(10, 2)])];
      return eq(
        progression.recommendNextSession(dbExercise, history),
        { type: 'beatLastTime', targetReps: 12 },
      );
    });

    await check('recommendNextSession: below-top-of-range sets -> beatLastTime with targetReps = maxReps + 1', () => {
      const history = [perf([workingSet(9, 2), workingSet(10, 2)])];
      return eq(
        progression.recommendNextSession(dbExercise, history),
        { type: 'beatLastTime', targetReps: 11 },
      );
    });

    // Bodyweight ruling: must never return increaseWeight for incrementType 'bodyweight', even when
    // every working set is clean at repsHigh and target RIR. Falls through to beatLastTime, holding
    // at repsHigh (there is no weight-based progression path for bodyweight work in this app).
    const bodyweightExercise = { repsLow: 10, repsHigh: 15, rir: '1', incrementType: 'bodyweight' };
    await check('recommendNextSession: bodyweight exercise, all working sets clean at repsHigh -> beatLastTime targetReps===repsHigh, never increaseWeight', () => {
      const history = [perf([workingSet(15, 1), workingSet(15, 1), workingSet(15, 1)])];
      const result = progression.recommendNextSession(bodyweightExercise, history);
      return eq(result, { type: 'beatLastTime', targetReps: bodyweightExercise.repsHigh });
    });

    // Final-review fix: an entry whose working sets are ALL warm-up (empty
    // workingSets array after the isWarmup filter) must never fall into
    // .every()'s vacuous "true" and recommend increaseWeight — there is
    // nothing clean to progress off of.
    await check('recommendNextSession: entry with only a warm-up set (no real working sets) never -> increaseWeight', () => {
      const history = [perf([warmupSet(5, 3)])];
      const result = progression.recommendNextSession(dbExercise, history);
      return (result.type !== 'increaseWeight') || `got ${JSON.stringify(result)}`;
    });

    // Follow-up to the above: a zero-working-sets entry must short-circuit
    // to noHistory entirely, not fall through to beatLastTime with
    // targetReps computed from Math.max() of an empty array (-Infinity).
    await check('recommendNextSession: entry with only a warm-up set -> noHistory, never a -Infinity target', () => {
      const history = [perf([warmupSet(5, 3)])];
      return eq(
        progression.recommendNextSession(dbExercise, history),
        { type: 'noHistory' },
      );
    });

    // RIR range-string parsing: '1-0' takes the last (strictest) number, 0, as the target RIR ceiling.
    const rangeRirExercise = { repsLow: 12, repsHigh: 20, rir: '1-0', incrementType: 'cable' };
    await check("recommendNextSession: rir '1-0' parses to target RIR 0 - a set at rir:1 blocks increaseWeight", () => {
      const history = [perf([workingSet(20, 0), workingSet(20, 1)])];
      return eq(
        progression.recommendNextSession(rangeRirExercise, history),
        { type: 'beatLastTime', targetReps: 20 },
      );
    });
    await check("recommendNextSession: rir '1-0' parses to target RIR 0 - all sets at rir:0 and repsHigh -> increaseWeight", () => {
      const history = [perf([workingSet(20, 0), workingSet(20, 0)])];
      return eq(
        progression.recommendNextSession(rangeRirExercise, history),
        { type: 'increaseWeight', amount: INCREMENT_BY_TYPE.cable },
      );
    });

    // RIR range-string parsing, ascending order: '0-1' is the real rir value for
    // rope-pushdown, reverse-pec-deck, leg-extension, seated-db-lateral-raise, and
    // single-arm-cable-pushdown in js/data/plan.js. It must ALSO parse to target
    // RIR 0 (via Math.min), not 1 - parsing must be order-independent, not just
    // "take the last token" (which would wrongly give 1 here).
    const ascendingRirExercise = { repsLow: 12, repsHigh: 15, rir: '0-1', incrementType: 'cable' };
    await check("recommendNextSession: rir '0-1' (ascending order) parses to target RIR 0 - a set at rir:1 blocks increaseWeight", () => {
      const history = [perf([workingSet(15, 0), workingSet(15, 1)])];
      return eq(
        progression.recommendNextSession(ascendingRirExercise, history),
        { type: 'beatLastTime', targetReps: 15 },
      );
    });
    await check("recommendNextSession: rir '0-1' (ascending order) parses to target RIR 0 - all sets at rir:0 and repsHigh -> increaseWeight", () => {
      const history = [perf([workingSet(15, 0), workingSet(15, 0)])];
      return eq(
        progression.recommendNextSession(ascendingRirExercise, history),
        { type: 'increaseWeight', amount: INCREMENT_BY_TYPE.cable },
      );
    });

    // --- js/timer.js (Task 5) ----------------------------------------------
    // Loaded dynamically (see Task 3 note above) so a missing module fails only these checks.
    // sessionStorage persists across reloads of this tab, so every timer test starts from a
    // cleared key and clears again afterward; re-running this page never sees a previous run's timer.
    const timer = await import('./js/timer.js').catch((err) => ({ loadError: err.message }));
    const TIMER_KEY = 'vtaper-rest-timer-end';
    const resetTimer = () => { try { timer.clearRestTimer(); } catch (_) { /* module may be missing */ } };

    await check('computeRemainingMs: end equals now is 0', () => eq(timer.computeRemainingMs(1000, 1000), 0));
    await check('computeRemainingMs: end 1000ms in future is 1000', () => eq(timer.computeRemainingMs(2000, 1000), 1000));
    await check('computeRemainingMs: already-elapsed end is clamped to 0, never negative', () => eq(timer.computeRemainingMs(500, 1000), 0));

    await check('startRestTimer then getActiveRestTimer returns the same end timestamp', () => {
      resetTimer();
      const end = timer.startRestTimer(60000);
      const active = timer.getActiveRestTimer();
      resetTimer();
      return (active === end && typeof end === 'number') || `start=${end}, active=${active}`;
    });

    await check('startRestTimer stores the end timestamp under sessionStorage key', () => {
      resetTimer();
      const end = timer.startRestTimer(60000);
      const raw = sessionStorage.getItem(TIMER_KEY);
      resetTimer();
      return Number(raw) === end || `raw=${raw}, end=${end}`;
    });

    await check('clearRestTimer then getActiveRestTimer is null', () => {
      timer.startRestTimer(60000);
      timer.clearRestTimer();
      return eq(timer.getActiveRestTimer(), null);
    });

    await check('getActiveRestTimer with no timer active is null', () => {
      resetTimer();
      return eq(timer.getActiveRestTimer(), null);
    });

    await check('adjustRestTimer with no timer active returns null', () => {
      resetTimer();
      return eq(timer.adjustRestTimer(15000), null);
    });

    await check('adjustRestTimer(+15000) increases the stored end by 15000', () => {
      resetTimer();
      const start = timer.startRestTimer(60000);
      const adjusted = timer.adjustRestTimer(15000);
      const stored = timer.getActiveRestTimer();
      resetTimer();
      return (adjusted === start + 15000 && stored === start + 15000)
        || `start=${start}, adjusted=${adjusted}, stored=${stored}`;
    });

    await check('adjustRestTimer(-15000) on a short timer clamps so remaining is never negative', () => {
      resetTimer();
      timer.startRestTimer(5000);
      const adjusted = timer.adjustRestTimer(-15000);
      const remaining = timer.computeRemainingMs(timer.getActiveRestTimer());
      resetTimer();
      return (typeof adjusted === 'number' && remaining === 0)
        || `adjusted=${adjusted}, remaining=${remaining}`;
    });

    // Review Focus: iOS Safari suspends background JS, so the timer must derive remaining time from
    // the absolute end timestamp. Backgrounding past the full rest duration must read as fully
    // elapsed (0), not as a stale paused value.
    await check('Review Focus: backgrounded past full duration reads 0 remaining (not paused, not negative)', () => {
      resetTimer();
      timer.startRestTimer(5000);
      const remaining = timer.computeRemainingMs(timer.getActiveRestTimer(), Date.now() + 10000);
      resetTimer();
      return eq(remaining, 0);
    });

    // --- js/nutrition.js (Task 12) ------------------------------------------
    // Loaded dynamically (see Task 3 note above) so a missing/broken module
    // (expected during the RED phase, before nutrition.js exists) fails only
    // these checks instead of blanking the whole page.
    const nutrition = await import('./js/nutrition.js').catch((err) => ({ loadError: err.message }));
    const nutritionMeals = nutrition.getMealsForDay ? nutrition.getMealsForDay('mon') : [];

    await check('getTargetsForWeek(2).kcal is 2500 (recomp)', () => eq(nutrition.getTargetsForWeek(2).kcal, 2500));
    await check('getTargetsForWeek(7).kcal is 2850 (leanGain)', () => eq(nutrition.getTargetsForWeek(7).kcal, 2850));

    await check("computeDayTotals: one checked meal, no add-on/banana/custom foods, equals that meal's own kcal/protein", () => {
      const totals = nutrition.computeDayTotals(nutritionMeals, [nutritionMeals[0].id], null, false, []);
      return eq(totals, { kcal: nutritionMeals[0].kcal, protein: nutritionMeals[0].protein });
    });

    await check('computeDayTotals: add-on + banana add 250+100 kcal and no protein', () => {
      const base = nutrition.computeDayTotals(nutritionMeals, [nutritionMeals[0].id], null, false, []);
      const withExtras = nutrition.computeDayTotals(nutritionMeals, [nutritionMeals[0].id], 'banana-peanut-butter', true, []);
      return eq([withExtras.kcal - base.kcal, withExtras.protein - base.protein], [350, 0]);
    });

    await check("applyProteinSwap: 'chicken curry (150 g breast)' chicken->fish", () => eq(
      nutrition.applyProteinSwap('chicken curry (150 g breast)', 'chicken', 'fish'),
      'fish curry (150 g breast)',
    ));

    // Review Focus: a sentence-initial match (capitalized, as most MEAL_PLAN item
    // strings start) must swap in a capitalized replacement, not lowercase the
    // start of the sentence.
    await check("applyProteinSwap: preserves sentence-initial capitalization ('Chicken tikka...' chicken->fish)", () => eq(
      nutrition.applyProteinSwap('Chicken tikka (150 g breast, 1 tsp oil)', 'chicken', 'fish'),
      'Fish tikka (150 g breast, 1 tsp oil)',
    ));

    // --- js/charts.js (Task 13) ---------------------------------------------
    // Loaded dynamically (see Task 3 note above) so a missing/broken module
    // (expected during the RED phase, before charts.js exists) fails only
    // these checks instead of blanking the whole page.
    const charts = await import('./js/charts.js').catch((err) => ({ loadError: err.message }));

    await check('rollingAverage: partial windows at the start ([70,71,72], window 7)', () => eq(
      charts.rollingAverage([70, 71, 72], 7),
      [70, 70.5, 71],
    ));

    await check('rollingAverage: index 7 of an 8-element array, window 7, is the average of elements 1-7', () => eq(
      charts.rollingAverage([1, 2, 3, 4, 5, 6, 7, 8], 7)[7],
      (2 + 3 + 4 + 5 + 6 + 7 + 8) / 7,
    ));

    await check("buildSVGLineChart: returns a string starting with '<svg' and containing '<path'", () => {
      const svg = charts.buildSVGLineChart(
        [{ x: 0, y: 0 }, { x: 1, y: 1 }],
        { width: 100, height: 50, color: '#fff' },
      );
      return (typeof svg === 'string' && svg.startsWith('<svg') && svg.includes('<path'))
        || `got ${JSON.stringify(svg)}`;
    });

    // Review Focus: the chart must also draw per-point circle markers, not
    // just the connecting path line.
    await check('buildSVGLineChart: contains one <circle> marker per point', () => {
      const points = [{ x: 0, y: 0 }, { x: 1, y: 5 }, { x: 2, y: 3 }];
      const svg = charts.buildSVGLineChart(points, { width: 100, height: 50, color: '#fff' });
      const circleCount = (svg.match(/<circle/g) || []).length;
      return circleCount === points.length || `got ${circleCount} circles, svg=${svg}`;
    });

    await check('buildSVGLineChart: parses as valid SVG via DOMParser (no XML errors)', () => {
      const svg = charts.buildSVGLineChart(
        [{ x: 0, y: 0 }, { x: 1, y: 1 }, { x: 2, y: 0 }],
        { width: 200, height: 80, color: '#35e0a1', padding: 10 },
      );
      const doc = new DOMParser().parseFromString(svg, 'image/svg+xml');
      const parseError = doc.querySelector('parsererror');
      return parseError === null || `parsererror: ${parseError.textContent}`;
    });

    await check('buildSVGLineChart: empty points array still returns a valid svg string (no NaN, no throw)', () => {
      const svg = charts.buildSVGLineChart([], { width: 100, height: 50, color: '#fff' });
      return (typeof svg === 'string' && svg.startsWith('<svg') && !svg.includes('NaN'))
        || `got ${JSON.stringify(svg)}`;
    });

    // --- js/checkin.js (Task 14) --------------------------------------------
    // Loaded dynamically (see Task 3 note above) so a missing/broken module
    // (expected during the RED phase, before checkin.js exists) fails only
    // these checks instead of blanking the whole page.
    const checkin = await import('./js/checkin.js').catch((err) => ({ loadError: err.message }));
    const decide = (input) => checkin.calorieDecision(input);

    await check('calorieDecision row 1: recomp, weight/waist in target range and lifts up -> "It\'s working"', () => eq(
      decide({ phase: 'recomp', weightDelta4wk: -0.4, waistDelta4wk: -1, liftsTrend: 'up', bloatPersisted: false }),
      { decision: "It's working", action: 'Change nothing', kcalChange: 0 },
    ));

    await check('calorieDecision row 2: leanGain, weight gain < 0.5 and |waist| < 0.5 -> Surplus too small', () => eq(
      decide({ phase: 'leanGain', weightDelta4wk: 0.4, waistDelta4wk: 0.2, liftsTrend: 'flat', bloatPersisted: false }),
      { decision: 'Surplus too small', action: '+150 kcal a day (≈ +35 g carbs)', kcalChange: 150 },
    ));

    await check('calorieDecision row 3: leanGain, weight gain > 1.5 -> Gaining too much fat', () => eq(
      decide({ phase: 'leanGain', weightDelta4wk: 1.6, waistDelta4wk: 0.2, liftsTrend: 'up', bloatPersisted: false }),
      { decision: 'Gaining too much fat', action: '-150 kcal a day (cut carbs), +2,000 steps a day', kcalChange: -150 },
    ));

    await check('calorieDecision row 4: recomp, weight and waist both down, lifts up, outside row-1 range -> Recomp is working well', () => eq(
      decide({ phase: 'recomp', weightDelta4wk: -1.5, waistDelta4wk: -1, liftsTrend: 'up', bloatPersisted: false }),
      { decision: 'Recomp is working well', action: 'Stay at 2,500 kcal for 2–4 more weeks before starting the surplus', kcalChange: 0 },
    ));

    await check('calorieDecision row 5: recomp, weight down > 1 and lifts down -> Eating too little', () => eq(
      decide({ phase: 'recomp', weightDelta4wk: -1.5, waistDelta4wk: 0, liftsTrend: 'down', bloatPersisted: false }),
      { decision: 'Eating too little', action: '+150 kcal a day', kcalChange: 150 },
    ));

    await check('calorieDecision row 6: flat weight and waist up, bloat persisted -> Bloating or fat gain, -150', () => eq(
      decide({ phase: 'recomp', weightDelta4wk: 0.1, waistDelta4wk: 0.5, liftsTrend: 'flat', bloatPersisted: true }),
      { decision: 'Bloating or fat gain', action: '-150 kcal a day', kcalChange: -150 },
    ));

    await check('calorieDecision fallback: no row matches -> No clear signal', () => eq(
      decide({ phase: 'recomp', weightDelta4wk: 0.5, waistDelta4wk: 0, liftsTrend: 'flat', bloatPersisted: false }),
      { decision: 'No clear signal', action: 'Keep current calories 2 more weeks and re-check', kcalChange: 0 },
    ));

    await check('volumeRule: onTrack', () => eq(
      checkin.volumeRule('onTrack'), { action: 'Keep the plan as written' },
    ));
    await check('volumeRule: shouldersLatsStalled', () => eq(
      checkin.volumeRule('shouldersLatsStalled'),
      { action: '+2 sets a week of lateral raises and +2 sets a week of pulldowns' },
    ));
    await check('volumeRule: noProgress', () => eq(
      checkin.volumeRule('noProgress'),
      { action: 'Check sleep and protein first, then take the deload a week early' },
    ));
    await check('volumeRule: jointsAchy', () => eq(
      checkin.volumeRule('jointsAchy'), { action: 'Remove 1 set from every exercise for 2 weeks' },
    ));
    await check('volumeRule: lowerBackTwinge', () => eq(
      checkin.volumeRule('lowerBackTwinge'),
      { action: "Drop that exercise's load 20%. If it persists, swap it: hack squat → leg press, hip thrust → glute bridge machine, row → machine row" },
    ));

    await check('vTaperRatio(100, 71.4) is close to 1.4', () => {
      const r = checkin.vTaperRatio(100, 71.4);
      return (Math.abs(r - 1.4) < 0.01) || `got ${r}`;
    });

    await check('computeWeekAverages: averages in-range records and returns null for absent fields', () => {
      const metrics = [
        { date: '2026-01-05', weightKg: 70, waistCm: 80 },
        { date: '2026-01-07', weightKg: 72, steps: 9000 },
        { date: '2026-01-20', weightKg: 99, waistCm: 1 }, // outside the week
      ];
      const r = checkin.computeWeekAverages(metrics, '2026-01-05', '2026-01-11');
      return eq(r, { avgWeight: 71, avgWaist: 80, avgSteps: 9000, avgSleep: null });
    });

    const passed = checks.filter((c) => c.ok).length;
    const failed = checks.length - passed;
    const summary = document.createElement('li');
    summary.id = 'summary';
    summary.style.fontWeight = 'bold';
    summary.textContent = `Total: ${checks.length} | Passed: ${passed} | Failed: ${failed}`;
    results.appendChild(summary);

    for (const { name, ok, detail } of checks) {
      const li = document.createElement('li');
      li.textContent = `${ok ? 'PASS' : 'FAIL'} - ${name}${ok ? '' : ` (${detail})`}`;
      results.appendChild(li);
    }
  </script>
</body>
</html>
